name: YouTube Shorts & Longform Auto Upload

on:
  schedule:
    # ⏰ GitHub Actions cron은 :00(정시)에 지연이 심함 → :23 오프셋 사용
    # 버퍼를 충분히 확보하여 GitHub 지연(최대 2-3시간) 흡수
    # 모든 스케줄: 쇼츠만 생성 (롱폼 없음)
    # 타겟: 12:00 KST, 15:00 KST, 18:00 KST, 22:00 KST
    - cron: '23 22 * * *'    # 22:23 UTC (07:23 KST) 실행 → 12:00 KST 공개 (쇼츠, ~5시간 버퍼)
    - cron: '23 1 * * *'     # 01:23 UTC (10:23 KST) 실행 → 15:00 KST 공개 (쇼츠, ~4.5시간 버퍼)
    - cron: '23 3 * * *'     # 03:23 UTC (12:23 KST) 실행 → 18:00 KST 공개 (쇼츠, ~6시간 버퍼)
    - cron: '23 7 * * *'     # 07:23 UTC (16:23 KST) 실행 → 21:00 KST 공개 (쇼츠, ~4.5시간 버퍼)
  
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      type:
        description: 'Video type to generate'
        required: true
        default: 'shorts'
        type: choice
        options:
          - 'shorts'
          - 'longform'
          - 'both'
      count:
        description: 'Number of videos to generate (shorts only)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      upload:
        description: 'Enable YouTube upload'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      schedule_delay:
        description: 'Upload delay (publish after N time from now)'
        required: false
        default: 'immediate'
        type: choice
        options:
          - 'immediate'
          - '30min'
          - '1hour'
          - '2hour'
          - '3hour'
          - '4hour'
          - '5hour'
          - '6hour'

env:
  UPLOAD_ENABLED: ${{ github.event.inputs.upload || 'true' }}
  VIDEO_COUNT: ${{ github.event.inputs.count || '1' }}
  VIDEO_TYPE: ${{ github.event.inputs.type || 'shorts' }}
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 30분 초과 시 강제 종료 (무한 행 방지)
    permissions:
      contents: write
    
    steps:
      - name: Determine video type and publish time
        id: set-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 수동 실행: 사용자 선택값 사용
            echo "VIDEO_TYPE=${{ github.event.inputs.type }}" >> $GITHUB_ENV
            DELAY="${{ github.event.inputs.schedule_delay || 'immediate' }}"
            if [ "$DELAY" = "immediate" ] || [ -z "$DELAY" ]; then
              echo "PUBLISH_AT=" >> $GITHUB_ENV
            else
              # schedule_delay 값에서 분 단위로 변환
              PUBLISH_AT=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          delay = '$DELAY'
          if delay == '30min':
              minutes = 30
          elif delay.endswith('hour'):
              minutes = int(delay.replace('hour', '')) * 60
          else:
              minutes = 0
          if minutes > 0:
              target = now + timedelta(minutes=minutes)
              print(target.strftime('%Y-%m-%dT%H:%M:%S+09:00'))
          else:
              print('')
          ")
              echo "PUBLISH_AT=$PUBLISH_AT" >> $GITHUB_ENV
              if [ -n "$PUBLISH_AT" ]; then
                echo "📅 예약 업로드: $PUBLISH_AT ($DELAY 후)"
              fi
            fi
          elif [ "${{ github.event.schedule }}" = "23 22 * * *" ]; then
            # 타겟: 12:00 KST
            echo "VIDEO_TYPE=shorts" >> $GITHUB_ENV
            PUBLISH_AT=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          target = now.replace(hour=12, minute=0, second=0, microsecond=0)
          if target <= now:
              print('')
          else:
              print(target.strftime('%Y-%m-%dT%H:%M:%S+09:00'))
          ")
            echo "PUBLISH_AT=$PUBLISH_AT" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "23 1 * * *" ]; then
            # 타겟: 15:00 KST
            echo "VIDEO_TYPE=shorts" >> $GITHUB_ENV
            PUBLISH_AT=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          target = now.replace(hour=15, minute=0, second=0, microsecond=0)
          if target <= now:
              print('')
          else:
              print(target.strftime('%Y-%m-%dT%H:%M:%S+09:00'))
          ")
            echo "PUBLISH_AT=$PUBLISH_AT" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "23 3 * * *" ]; then
            # 타겟: 18:00 KST
            echo "VIDEO_TYPE=shorts" >> $GITHUB_ENV
            PUBLISH_AT=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          target = now.replace(hour=18, minute=0, second=0, microsecond=0)
          if target <= now:
              print('')
          else:
              print(target.strftime('%Y-%m-%dT%H:%M:%S+09:00'))
          ")
            echo "PUBLISH_AT=$PUBLISH_AT" >> $GITHUB_ENV
          elif [ "${{ github.event.schedule }}" = "23 7 * * *" ]; then
            # 타겟: 21:00 KST
            echo "VIDEO_TYPE=shorts" >> $GITHUB_ENV
            PUBLISH_AT=$(python3 -c "
          from datetime import datetime, timedelta, timezone
          kst = timezone(timedelta(hours=9))
          now = datetime.now(kst)
          target = now.replace(hour=21, minute=0, second=0, microsecond=0)
          if target <= now:
              print('')
          else:
              print(target.strftime('%Y-%m-%dT%H:%M:%S+09:00'))
          ")
            echo "PUBLISH_AT=$PUBLISH_AT" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install FFmpeg and Korean fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          
          # apt-get update (최대 3회 재시도, 2분 타임아웃)
          for i in 1 2 3; do
            echo "🔄 apt-get update 시도 $i/3..."
            if timeout 120 sudo apt-get update -qq 2>/dev/null; then
              echo "✅ apt-get update 성공"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "⚠️ apt-get update 3회 실패 — 캐시된 패키지로 진행"
            fi
            sleep 5
          done
          
          # FFmpeg + 한국어 폰트 설치 (한 번에, 5분 타임아웃, 3회 재시도)
          # fonts-noto-cjk-extra 제외 (수백 MB로 설치 시간 과다)
          for i in 1 2 3; do
            echo "🔄 패키지 설치 시도 $i/3..."
            if timeout 300 sudo apt-get install -y --no-install-recommends \
              ffmpeg fonts-noto-cjk fonts-nanum 2>&1; then
              echo "✅ 패키지 설치 성공"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "❌ 패키지 설치 실패"
              exit 1
            fi
            sleep 10
          done
          
          # 폰트 캐시 업데이트 (1분 타임아웃)
          timeout 60 sudo fc-cache -f 2>/dev/null || true
          
          # 설치 확인
          echo "=== FFmpeg 버전 ==="
          ffmpeg -version | head -1 || echo "⚠️ FFmpeg not found"
          echo "=== 설치된 한글 폰트 ==="
          fc-list | grep -i "noto\|nanum" | head -5 || echo "⚠️ No fonts found"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Setup credentials
        env:
          YT_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YT_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p config
          
          # YouTube OAuth 인증 파일 생성 (env 변수에서 안전하게 쓰기)
          echo "$YT_CLIENT_SECRETS" > config/client_secrets.json
          echo "$YT_CREDENTIALS" > config/youtube_credentials.json
          echo "$YT_CREDENTIALS" > config/youtube_credentials_L4y1Qbdg.json
          
          # config.json에 API 키 주입 (env → config.json)
          python -c "
          import json, os
          with open('config/config.json', 'r') as f:
              config = json.load(f)
          config['gemini_api_key'] = os.environ['GEMINI_API_KEY']
          config['huggingface_token'] = os.environ['HUGGINGFACE_TOKEN']
          config['together_api_key'] = os.environ['TOGETHER_API_KEY']
          config['pexels_api_key'] = os.environ['PEXELS_API_KEY']
          config['scheduler']['upload_enabled'] = ('${{ env.UPLOAD_ENABLED }}' == 'true')
          with open('config/config.json', 'w') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
          "
      
      - name: Validate YouTube credentials
        if: env.UPLOAD_ENABLED == 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'scripts')
          from youtube_uploader import YouTubeUploader
          u = YouTubeUploader()
          if not u.authenticate():
              print('::error::YouTube 인증 실패 - 로컬에서 python scripts/youtube_uploader.py 실행 후 재인증하세요')
              sys.exit(1)
          ch = u.get_authenticated_channel()
          if ch:
              print(f'✅ 인증 확인: {ch[\"title\"]} ({ch[\"id\"]})')
          else:
              print('::error::채널 조회 실패 - 인증은 됐지만 채널 정보를 읽을 수 없습니다')
              sys.exit(1)
          "

      - name: Create video
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          PUBLISH_ARG=""
          if [ -n "${{ env.PUBLISH_AT }}" ]; then
            PUBLISH_ARG="--publish-at ${{ env.PUBLISH_AT }}"
          fi
          if [ "${{ env.UPLOAD_ENABLED }}" = "true" ]; then
            python main.py --type ${{ env.VIDEO_TYPE }} --count ${{ env.VIDEO_COUNT }} $PUBLISH_ARG
          else
            python main.py --type ${{ env.VIDEO_TYPE }} --count ${{ env.VIDEO_COUNT }} --no-upload
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-video-${{ github.run_number }}
          path: |
            output/videos/*.mp4
            output/longform_videos/*.mp4
            output/thumbnails/*.jpg
            output/images/*.png
            output/longform_images/*.jpg
            logs/*.json
          retention-days: 7

      - name: Auto-renew YouTube credentials Secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          CRED_FILE="config/youtube_credentials_L4y1Qbdg.json"
          if [ -f "$CRED_FILE" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set YOUTUBE_CREDENTIALS < "$CRED_FILE"
            echo "✅ GitHub Secret YOUTUBE_CREDENTIALS 자동 갱신 완료"
          elif [ -z "$GH_TOKEN" ]; then
            echo "⚠️ GH_PAT Secret이 설정되지 않아 자동 갱신 건너뜀"
          fi

      - name: Persist topic history to repo
        if: always()
        run: |
          if [ ! -f logs/topic_history.json ]; then
            echo "topic_history.json 없음 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f logs/topic_history.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: update topic history [skip ci]"
          git stash --include-untracked
          git pull --rebase origin main || true
          git stash pop || true
          git push
